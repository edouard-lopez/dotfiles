shell = "bash -c '{}'"

hooks = ["echo \"The current scheme is: $(tinty current) [$TINTY_SCHEME_ID]\""]

default-cycle-ring = "default"

[[rings]]
name = "default"
schemes = ["base16-ayu-light", "base16-ayu-mirage"]

[[items]]
name = "tinted-shell"
path = "https://github.com/tinted-theming/tinted-shell"
hook = ". %f"
supported-systems = ["base16"]
themes-dir = "scripts"

[[items]]
path = "https://github.com/tinted-theming/base16-vim"
name = "base16-vim"
themes-dir = "colors"

[[items]]
path = "https://github.com/tinted-theming/tinted-tmux"
name = "tinted-tmux"
# Check if tmux is in use and if it is, reload the config file
hook = "tmux run 2> /dev/null && tmux source-file %f; echo THEME: $TINTY_THEME_FILE_PATH"
themes-dir = "colors"

[[items]]
path = "https://github.com/tinted-theming/tinted-delta"
name = "tinted-delta"
themes-dir = "configs"
supported-systems = ["base16", "base24"]

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-terminal"
themes-dir = "themes/konsole"
hook = "cp -f \"$TINTY_THEME_FILE_PATH\" ~/.local/share/konsole/$TINTY_SCHEME_ID.colorscheme && \"$TINTY_REPO_PATH/scripts/konsoleprofile.sh\" ColorScheme=$TINTY_SCHEME_ID"
supported-systems = ["base16", "base24"]


